name: CEnT@HOME monitor

on:
  schedule:
    # Every 20 minutes. Free on a PUBLIC repository.
    # On a PRIVATE repository change this to "*/30 * * * *" to stay inside
    # GitHub's 2,000 free minutes per month.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        default: check
        options:
          - check
          - test-email

permissions:
  contents: write   # only to save state.json back to the repository

concurrency:
  group: cents-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the CISIA calendar
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.action }}" = "test-email" ]; then
            python3 monitor.py --test-email
          else
            python3 monitor.py
          fi

      - name: Save state
        if: always() && inputs.action != 'test-email'
        run: |
          [ -f state.json ] || exit 0
          git config user.name "cents-monitor"
          git config user.email "cents-monitor@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && { echo "State unchanged"; exit 0; }
          git commit -m "Update monitor state [skip ci]"
          git pull --rebase --quiet || true
          git push
