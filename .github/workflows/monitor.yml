name: CEnT@HOME monitor

on:
  # Main trigger: cron-job.org calls GitHub every 15 minutes (see README),
  # because GitHub's own schedule is "best effort" and can skip hours.
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        default: check
        options:
          - check
          - test-email
  # Backup trigger: GitHub's own schedule (free on a public repository).
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write   # only to save state.json back to the repository

# One check at a time; a check that is already waiting is replaced by the newest one.
concurrency:
  group: cents-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always load the latest saved state, so nothing is emailed twice

      - name: Check the CISIA calendar
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.action }}" = "test-email" ]; then
            python3 monitor.py --test-email
          else
            python3 monitor.py
          fi

      - name: Save state
        if: always() && inputs.action != 'test-email'
        run: |
          [ -f state.json ] || exit 0
          cp state.json "$RUNNER_TEMP/state.json"
          git config user.name "cents-monitor"
          git config user.email "cents-monitor@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            git add state.json
            git diff --cached --quiet && { echo "State unchanged"; exit 0; }
            git commit --quiet -m "Update monitor state [skip ci]"
            git push --quiet origin HEAD:main && { echo "State saved"; exit 0; }
            echo "Push attempt $attempt failed, retrying"; sleep 5
          done
          echo "::warning::Could not save state.json; the next check may repeat an alert."
